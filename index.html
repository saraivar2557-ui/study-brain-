
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Brain</title>

<style>
:root {
    --bg:#f4fbf5;
    --panel:#ffffff;
    --text:#193322;
    --muted:#688071;
    --green:#63b879;
    --green2:#e5f6e9;
    --border:#dceee0;
}
body.dark {
    --bg:#101b15;
    --panel:#19271e;
    --text:#edf7ef;
    --muted:#a8b9ac;
    --green:#82cf96;
    --green2:#263d2d;
    --border:#304536;
}
* {box-sizing:border-box}
body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}
header {
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:15px;
    position:sticky;
    top:0;
    z-index:5;
}
.header-inner {
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
}
.brand {
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:bold;
}
.brand-icon {
    width:42px;height:42px;
    background:#f5cf58;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:26px;
}
nav {display:flex;gap:6px;flex-wrap:wrap}
nav button {
    background:transparent;
    border:0;
    padding:10px 12px;
    border-radius:12px;
    color:var(--text);
    cursor:pointer;
    font-weight:bold;
}
nav button:hover {background:var(--green2)}
main {
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
    min-height:70vh;
}
.hero {
    background:linear-gradient(135deg,var(--green2),var(--panel));
    border:1px solid var(--border);
    border-radius:24px;
    padding:40px 24px;
    text-align:center;
}
.hero-logo {
    width:90px;height:90px;
    background:#f5cf58;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:52px;
    margin:auto;
}
h1 {font-size:36px}
.tagline {color:var(--green);font-weight:bold;font-size:19px}
.welcome {
    max-width:650px;
    margin:20px auto;
    color:var(--muted);
    line-height:1.7;
}
.creator-credit {
    margin-top:25px;
    font-weight:bold;
    color:var(--muted);
}
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}
.card,.content {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
}
.card {cursor:pointer;transition:.15s}
.card:hover {transform:translateY(-3px)}
.card h3 {margin-bottom:5px}
.subject-icon {font-size:30px}
.back {
    background:var(--green2);
    color:var(--text);
    border:0;
    padding:11px 15px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:20px;
    font-weight:bold;
}
.content {line-height:1.7}
.note {
    background:var(--green2);
    padding:14px;
    border-radius:10px;
    border-left:4px solid var(--green);
    margin:15px 0;
}
.primary,.secondary {
    border:0;
    border-radius:12px;
    padding:12px 17px;
    font-weight:bold;
    cursor:pointer;
}
.primary {background:var(--green);color:#102819}
.secondary {background:var(--green2);color:var(--text)}
.section-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}
.question {
    padding:17px 0;
    border-bottom:1px solid var(--border);
}
.option {
    display:block;
    padding:10px;
    margin:8px 0;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
}
.result {
    background:var(--green2);
    padding:18px;
    border-radius:14px;
    margin-top:18px;
}
.empty {
    padding:25px;
    text-align:center;
    background:var(--panel);
    border-radius:16px;
    color:var(--muted);
}
.search-box {
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
    font-size:16px;
    margin:10px 0 20px;
}
.search-box:focus {
    outline:2px solid var(--green);
}
.muted {color:var(--muted)}
footer {
    text-align:center;
    padding:25px;
    color:var(--muted);
}
@media(max-width:650px) {
    .header-inner {flex-direction:column;align-items:flex-start}
    h1 {font-size:29px}
}
</style>
</head>

let currentSubject = "";
let currentSection = "";
let favorites = JSON.parse(localStorage.getItem("sb_favs") || "[]");
let history = JSON.parse(localStorage.getItem("sb_history") || "[]");

function goHome() {
 currentSubject = "";
 document.getElementById("app").innerHTML = `
 <section class="hero">
  <div class="hero-logo">🧠</div>
  <h1>Study Brain</h1>
  <div class="tagline">O futuro começa agora.</div>
  <p class="welcome">
   Bem-vindo à Study Brain! 🧠<br>
   O futuro começa agora.<br>
   Aqui vais encontrar tudo o que precisas para aprender,
   praticar e preparar os teus testes. Descobre, aprende e
   supera os teus limites. O teu sucesso começa aqui!
   <br><b>Aprende. Pratica. Conquista.</b>
  </p>
  <p class="creator-credit">Feito por Rafael Saraiva 💚</p>
 </section>`;
}

function showSubjects() {
 document.getElementById("app").innerHTML = `
 <h2>As minhas disciplinas</h2>
 <input
   class="search-box"
   id="subjectSearch"
   type="search"
   placeholder="🔎 Pesquisar uma matéria..."
   oninput="searchTopics(this.value)"
 >
 <div id="searchResults"></div>
 <div class="grid" id="subjectGrid">
 ${subjects.map(s=>`
  <article class="card" onclick="openSubject('${s[0]}')">
   <div class="subject-icon">${s[1]}</div>
   <h3>${s[0]}</h3>
   <p class="muted">9.º ano</p>
  </article>`).join("")}
 </div>`;
}

function searchTopics(value) {
 const term = value.trim().toLocaleLowerCase("pt-PT");
 const results = document.getElementById("searchResults");
 const grid = document.getElementById("subjectGrid");

 if (!term) {
   results.innerHTML = "";
   grid.style.display = "grid";
   return;
 }

 grid.style.display = "none";

 const matches = [];

 subjects.forEach(subject => {
   const name = subject[0];
   curriculum[name].forEach((topic,index) => {
     const searchable = (
       name + " " + topic.title + " " +
       topic.body.replace(/<[^>]*>/g," ")
     ).toLocaleLowerCase("pt-PT");

     if (searchable.includes(term)) {
       matches.push({name,index,title:topic.title,icon:subject[1]});
     }
   });
 });

 if (matches.length === 0) {
   results.innerHTML = `<div class="empty">Não foram encontrados temas para "${value}". Experimenta outra palavra.</div>`;
   return;
 }

 results.innerHTML = `
 <h3>Resultados da pesquisa</h3>
 <div class="grid">
 ${matches.map(item=>`
   <article class="card" onclick="currentSubject='${item.name}';openTopic(${item.index})">
    <div class="subject-icon">${item.icon}</div>
    <h3>${item.title}</h3>
    <p class="muted">${item.name}</p>
   </article>
 `).join("")}
 </div>`;
}

function openSubject(name) {
 currentSubject = name;
 const topics = curriculum[name];
 document.getElementById("app").innerHTML = `
 <button class="back" onclick="showSubjects()">← Disciplinas</button>
 <h2>${name}</h2>
 <p class="muted">Escolhe uma secção.</p>
 <div class="section-grid">
 ${sections.map(s=>`
  <article class="card" onclick="openSection('${s[0]}')">
   <div class="subject-icon">${s[1]}</div><h3>${s[0]}</h3>
  </article>`).join("")}
 </div>
 <h3 style="margin-top:28px">Temas disponíveis</h3>
 <div class="grid">
 ${topics.map((t,i)=>`
  <article class="card" onclick="openTopic(${i})">
   <h3>${t.title}</h3><p class="muted">Consultar matéria</p>
  </article>`).join("")}
 </div>`;
}

function openSection(section) {
 currentSection = section;
 if(section==="Exercícios" || section==="Preparação para testes") {
  document.getElementById("app").innerHTML = `
  <button class="back" onclick="openSubject('${currentSubject}')">← ${currentSubject}</button>
  <div class="content"><h2>${section} · ${currentSubject}</h2>
  <p>Responde às perguntas e consulta a correção no final.</p>
  <div id="quizArea"></div>
  <button class="primary" onclick="startQuiz()">Começar</button></div>`;
  return;
 }
 document.getElementById("app").innerHTML = `
 <button class="back" onclick="openSubject('${currentSubject}')">← ${currentSubject}</button>
 <div class="content"><h2>${section} · ${currentSubject}</h2>
 <div class="grid">${curriculum[currentSubject].map((t,i)=>`
 <article class="card" onclick="openTopic(${i})"><h3>${t.title}</h3><p class="muted">Abrir tema</p></article>`).join("")}</div>
 </div>`;
}

function openTopic(index) {
 const topic = curriculum[currentSubject][index];
 const key = currentSubject+"|"+topic.title;
 const saved = favorites.includes(key);
 document.getElementById("app").innerHTML = `
 <button class="back" onclick="openSubject('${currentSubject}')">← ${currentSubject}</button>
 <div class="content">
 <h2>${topic.title}</h2>
 ${topic.body}
 <div class="note small">Conteúdo de estudo original para apoio. Confirma sempre os temas abordados na tua turma e no programa da tua escola.</div>
 <button class="secondary" onclick="toggleFavorite('${currentSubject}',${index})">
 ${saved?"★ Remover dos favoritos":"☆ Guardar nos favoritos"}
 </button>
 </div>`;
}

function startQuiz() {
 const questions = quizBank[currentSubject] || [];
 document.getElementById("quizArea").innerHTML = questions.map((q,i)=>`
 <div class="question"><b>${i+1}. ${q.q}</b>
 ${q.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}
 </div>`).join("")+`<button class="primary" onclick="finishQuiz()">Corrigir respostas</button>`;
}

function finishQuiz() {
 const questions = quizBank[currentSubject] || [];
 let score=0, feedback="";
 questions.forEach((q,i)=>{
  const selected=document.querySelector('input[name="q'+i+'"]:checked');
  const correct=selected && Number(selected.value)===q.a;
  if(correct) score++;
  feedback+=`<p><b>${correct?"✓ Correto":"✗ Incorreto"}:</b> ${q.e}</p>`;
 });
 const pct=Math.round(score/questions.length*100);
 const grade=pct<20?"Fraco":pct<50?"Insuficiente":pct<70?"Suficiente":pct<90?"Bom":"Muito Bom";
 history.unshift({subject:currentSubject,date:new Date().toLocaleString("pt-PT"),pct,score,total:questions.length});
 localStorage.setItem("sb_history",JSON.stringify(history));
 document.getElementById("quizArea").innerHTML=`
 <div class="result"><h3>${score}/${questions.length} — ${pct}%</h3>
 <b>${grade}</b>${feedback}
 <button class="secondary" onclick="startQuiz()">Tentar novamente</button></div>`;
}

function toggleFavorite(subject,index) {
 const key=subject+"|"+curriculum[subject][index].title;
 favorites=favorites.includes(key)?favorites.filter(x=>x!==key):[...favorites,key];
 localStorage.setItem("sb_favs",JSON.stringify(favorites));
 openTopic(index);
}

function showFavorites() {
 const cards=favorites.map(key=>{
  const [subject,title]=key.split("|");
  const s=subjects.find(x=>x[0]===subject);
  const index=curriculum[subject].findIndex(t=>t.title===title);
  if(index<0) return "";
  return `<article class="card" onclick="currentSubject='${subject}';openTopic(${index})">
   <div class="subject-icon">${s?s[1]:"⭐"}</div><h3>${title}</h3><p>${subject}</p>
  </article>`;
 }).join("");

 const results=history.map(h=>`
 <div class="content" style="margin:10px 0">
 <b>${h.subject}</b> — ${h.pct}% (${h.score}/${h.total})
 <p class="muted small">${h.date}</p></div>`).join("");

 document.getElementById("app").innerHTML=`
 <h2>Favoritos</h2>
 ${cards?`<div class="grid">${cards}</div>`:`<div class="empty">Ainda não tens favoritos.</div>`}
 <h2 style="margin-top:30px">Histórico de resultados</h2>
 ${results||`<div class="empty">Ainda não tens resultados guardados.</div>`}`;
}

function toggleTheme() {
 document.body.classList.toggle("dark");
 localStorage.setItem("sb_dark",document.body.classList.contains("dark")?"1":"0");
}

if(localStorage.getItem("sb_dark")==="1") document.body.classList.add("dark");
goHome();

</script>
